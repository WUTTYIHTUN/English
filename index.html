<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English-Myanmar Vocab Audio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Padauk:wght@400;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif;
      background-color: #f8fafc;
    }
    .myanmar-text {
      font-family: 'Padauk', sans-serif;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

  <!-- VIBRANT PURPLE-TO-PINK HEADER BAR WITH EMBEDDED PILL VIEW SWITCHER -->
  <header class="bg-gradient-to-r from-[#4f46e5] via-[#7c3aed] to-[#ec4899] text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      
      <!-- Logo / Title -->
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateToHome()">
        <div class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-md">
          <i class="fa-solid fa-language text-2xl text-amber-300"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-xl tracking-tight leading-tight">English - Myanmar Vocab Audio</h1>
          <p class="text-xs text-purple-100 font-medium">Pronunciation Guide & Flashcard Trainer</p>
        </div>
      </div>

      <!-- Center / Right Controls Bar -->
      <div class="flex items-center space-x-3">
        
        <!-- View Switcher Pills (Visible inside Vocab view) -->
        <div id="quick-view-toggle" class="hidden bg-black/20 p-1 rounded-full backdrop-blur-md flex items-center space-x-1 border border-white/10">
          <button onclick="switchTab('list')" id="tab-btn-list" class="px-4 py-1.5 rounded-full text-xs font-bold bg-white text-indigo-700 shadow-sm transition">
            <i class="fa-solid fa-list mr-1.5"></i>List View
          </button>
          <button onclick="switchTab('cards')" id="tab-btn-cards" class="px-4 py-1.5 rounded-full text-xs font-bold text-white hover:bg-white/10 transition">
            <i class="fa-solid fa-clone mr-1.5"></i>Flashcards
          </button>
          <button onclick="switchTab('quiz')" id="tab-btn-quiz" class="px-4 py-1.5 rounded-full text-xs font-bold text-white hover:bg-white/10 transition">
            <i class="fa-solid fa-circle-question mr-1.5"></i>Quiz
          </button>
        </div>

        <!-- Speed Selector Pills -->
        <div class="bg-black/20 p-1 rounded-full backdrop-blur-md flex items-center space-x-1 text-xs border border-white/10">
          <button onclick="setSpeed(0.75)" id="speed-075" class="px-2.5 py-1 rounded-full font-bold text-white/80 hover:text-white transition">0.75x</button>
          <button onclick="setSpeed(1.0)" id="speed-10" class="px-2.5 py-1 rounded-full bg-white text-indigo-700 font-bold shadow-sm">1.0x</button>
          <button onclick="setSpeed(1.25)" id="speed-125" class="px-2.5 py-1 rounded-full font-bold text-white/80 hover:text-white transition">1.25x</button>
        </div>

        <button onclick="navigateToHome()" class="p-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white transition border border-white/10" title="Home">
          <i class="fa-solid fa-house text-sm"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- BREADCRUMB INDICATOR BAR -->
  <div class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between text-sm">
      <div id="breadcrumb" class="flex items-center space-x-2 font-medium text-slate-600">
        <!-- JS Breadcrumb -->
      </div>
      <div id="vocab-count-badge" class="hidden px-3 py-1 bg-indigo-50 text-indigo-700 font-bold text-xs rounded-full border border-indigo-100">
        0 Words
      </div>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6">

    <!-- 1. HOME SCREEN (10 UNBOXED PILL/CARD BUTTONS IN EXACT SKETCH GRID) -->
    <div id="screen-home" class="space-y-6">
      <div class="text-center max-w-2xl mx-auto my-2">
        <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight">Select Course Module</h2>
        <p class="text-slate-500 text-sm mt-1">Select a Book to access 30 Chapters, or choose a direct category below.</p>
      </div>

      <!-- Grid layout matching user diagram -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5 max-w-4xl mx-auto">
        <!-- Row 1: Book 1, Book 2, Book 3 -->
        <button onclick="selectBook(1)" class="group bg-gradient-to-br from-indigo-500 to-indigo-700 text-white rounded-2xl p-6 shadow-sm hover:shadow-xl transition transform hover:-translate-y-1 text-left flex items-center justify-between">
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-200">Series</span>
            <h3 class="text-2xl font-black mt-0.5">Book 1</h3>
            <p class="text-xs text-indigo-100 mt-1">30 Chapters</p>
          </div>
          <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-xl group-hover:scale-110 transition">
            <i class="fa-solid fa-book"></i>
          </div>
        </button>

        <button onclick="selectBook(2)" class="group bg-gradient-to-br from-indigo-500 to-indigo-700 text-white rounded-2xl p-6 shadow-sm hover:shadow-xl transition transform hover:-translate-y-1 text-left flex items-center justify-between">
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-200">Series</span>
            <h3 class="text-2xl font-black mt-0.5">Book 2</h3>
            <p class="text-xs text-indigo-100 mt-1">30 Chapters</p>
          </div>
          <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-xl group-hover:scale-110 transition">
            <i class="fa-solid fa-book"></i>
          </div>
        </button>

        <button onclick="selectBook(3)" class="group bg-gradient-to-br from-indigo-500 to-indigo-700 text-white rounded-2xl p-6 shadow-sm hover:shadow-xl transition transform hover:-translate-y-1 text-left flex items-center justify-between">
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-200">Series</span>
            <h3 class="text-2xl font-black mt-0.5">Book 3</h3>
            <p class="text-xs text-indigo-100 mt-1">30 Chapters</p>
          </div>
          <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-xl group-hover:scale-110 transition">
            <i class="fa-solid fa-book"></i>
          </div>
        </button>

        <!-- Row 2: Book 4,
